name: TEMP ELITE Formal ROI 24h Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-elite-24h-snapshot.yml"
      - "experiments/export_elite_formal_roi_24h_snapshot.py"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy rasterio

      - name: Export 24h ELITE snapshot
        run: python experiments/export_elite_formal_roi_24h_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata/elite-formal-roi-20190924-24h.json.gz.b64
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "data: add ELITE formal ROI 24h snapshot [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
