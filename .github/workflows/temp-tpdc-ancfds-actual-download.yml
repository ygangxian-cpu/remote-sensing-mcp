name: TEMP TPDC ANCFDS Actual Download
run-name: "TPDC ANCFDS actual download 20190924 04UTC"

on:
  push:
    paths:
      - ".github/workflows/temp-tpdc-ancfds-actual-download.yml"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests rasterio
      - name: Download and crop one ANCFDS-LST hour
        run: python experiments/test_tpdc_ancfds_actual_download.py
      - name: Upload cropped verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpdc-ancfds-20190924-04utc-test
          path: |
            output/tpdc_download_test/ANCFDS_LST_*_ZHANGYE.tif
            output/tpdc_download_test/result.json
          if-no-files-found: warn
          retention-days: 3
