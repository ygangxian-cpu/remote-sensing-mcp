name: Cancel Hamdi Cairo experiment

on:
  push:
    branches:
      - "experiment/hamdi-2026-cairo-predictors-v1"
    paths:
      - ".github/workflows/cancel-hamdi-2026-cairo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - name: Install Earth Engine client
        run: pip install earthengine-api google-auth

      - name: Cancel Hamdi Earth Engine tasks
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import ee

          project = os.getenv("EE_PROJECT") or "ee-ygangxian"
          ee.Initialize(project=project)

          target = "hamdi_2026_cairo_predictors_100m_tmp"
          cancelled = []
          for task in ee.data.getTaskList():
              desc = task.get("description", "")
              state = task.get("state", "")
              if desc == target and state in {"READY", "RUNNING"}:
                  task_id = task["id"]
                  ee.data.cancelTask(task_id)
                  cancelled.append({"id": task_id, "state": state, "description": desc})

          asset_id = f"projects/{project}/assets/{target}"
          try:
              ee.data.deleteAsset(asset_id)
              deleted_asset = True
          except Exception:
              deleted_asset = False

          print(json.dumps({"cancelled_tasks": cancelled, "deleted_asset": deleted_asset}, indent=2))
          PY
