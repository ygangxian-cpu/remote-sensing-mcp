name: Remote Sensing ERA5-Land Worker
run-name: "ERA5-Land ${{ inputs.job_key }}"

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: Correlation ID used by the MCP gateway
        required: true
        type: string
      start_date:
        description: Inclusive UTC start date/time (ISO)
        required: true
        type: string
      end_date:
        description: Exclusive UTC end date/time (ISO)
        required: true
        type: string
      bbox:
        description: xmin,ymin,xmax,ymax in EPSG:4326
        required: true
        type: string
      region_name:
        description: Stable ROI name, e.g. zhangye or beijing
        required: false
        default: ""
        type: string




permissions:
  contents: write

concurrency:
  group: era5-land-repository-cache
  cancel-in-progress: false

jobs:
  era5-land:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Restore Earth Engine user credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
            echo "Using Earth Engine user OAuth credentials."
          elif [ -n "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "Using Earth Engine service-account credentials."
          else
            echo "::error::Missing EE_USER_CREDENTIALS_JSON_BASE64 or EE_SERVICE_ACCOUNT_JSON_BASE64"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ERA5-Land worker dependencies
        run: pip install earthengine-api google-auth requests numpy rasterio

      - name: Fetch/reuse ERA5-Land hourly ROI cache
        run: >-
          python era5_worker.py
          --start-date '${{ inputs.start_date }}'
          --end-date '${{ inputs.end_date }}'
          --bbox '${{ inputs.bbox }}'
          --region-name '${{ inputs.region_name }}'

      - name: Commit new ERA5-Land cache
        run: |
          if [ -n "$(git status --porcelain -- data/era5_land data/metadata/era5-land-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/era5_land data/metadata/era5-land-index.json
            git commit -m "data: cache ERA5-Land ${{ inputs.region_name }} ${{ inputs.start_date }} [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "ERA5-Land cache already present; nothing to commit."
          fi

      - name: Remove temporary files
        if: always()
        run: rm -rf output/work

      - name: Upload ERA5-Land result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.job_key }}"
          path: |
            output/era5_land/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
