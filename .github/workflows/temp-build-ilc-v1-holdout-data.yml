name: TEMP Build ILC-v1 Holdout Data

on:
  push:
    branches: [main]
    paths:
      - "experiments/build_ilc_v1_holdout_snapshots.py"
      - ".github/workflows/temp-build-ilc-v1-holdout-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          pip install earthengine-api google-auth requests remotezip
          numpy pandas scipy scikit-learn rasterio pyproj h5py pyhdf affine

      - name: Syntax check
        run: |
          python -m py_compile experiments/build_ilc_v1_holdout_snapshots.py
          python -m py_compile experiments/run_frozen_v3_multidate_validation.py

      - name: Build data-only holdout snapshots
        run: python experiments/build_ilc_v1_holdout_snapshots.py

      - name: Upload holdout snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ilc-v1-holdout-data-2019
          path: |
            output/ilc_v1_holdout_data/*.npz
            output/ilc_v1_holdout_data/*.json
          if-no-files-found: error
          retention-days: 14
