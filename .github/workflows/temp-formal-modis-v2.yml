name: TEMP Formal ROI MODIS v2 Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-formal-modis-v2.yml"
      - "experiments/export_modis_precalibration_snapshot.py"

permissions:
  contents: write

jobs:
  modis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install earthengine-api google-auth requests numpy rasterio

      - name: Fetch MODIS v2 for formal ROI
        run: >-
          python modis_worker.py
          --start-date 2019-09-24
          --end-date 2019-09-25
          --bbox '99.86,38.67,100.5,39.43'
          --region-name zhangye-experiment
          --platforms 'terra,aqua'

      - name: Export compact MODIS snapshot
        run: python experiments/export_modis_precalibration_snapshot.py

      - name: Commit MODIS cache and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/modis_lst data/metadata/modis-lst-index.json data/metadata/modis-precalibration-20190924-formal-roi.json.gz.b64
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "data: cache formal ROI MODIS v2 2019-09-24 [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Print quality report
        if: always()
        run: cat output/result.json || true
