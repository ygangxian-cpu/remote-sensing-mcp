name: Remote Sensing ELITE Worker
run-name: "ELITE ${{ inputs.job_key || format('cache-hit-test-{0}', github.run_id) }}"

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: Correlation ID used by the MCP gateway
        required: true
        type: string
      start_date:
        description: Inclusive start date/time (ISO)
        required: true
        type: string
      end_date:
        description: Exclusive end date/time (ISO)
        required: true
        type: string
      bbox:
        description: xmin,ymin,xmax,ymax in EPSG:4326
        required: true
        type: string
      region_name:
        description: Stable ROI name, e.g. zhangye or beijing
        required: false
        default: ""
        type: string
      output_unit:
        description: celsius or kelvin
        required: true
        default: celsius
        type: choice
        options:
          - celsius
          - kelvin

  push:
    branches:
      - main
    paths:
      - "worker.py"

permissions:
  contents: write

concurrency:
  group: elite-china-cache
  cancel-in-progress: false

jobs:
  elite:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      START_DATE: "${{ inputs.start_date || '2019-09-24T00:00:00' }}"
      END_DATE: "${{ inputs.end_date || '2019-09-24T01:00:00' }}"
      BBOX: "${{ inputs.bbox || '100.1,38.7667,100.6,39.0667' }}"
      REGION_NAME: "${{ inputs.region_name || 'zhangye' }}"
      OUTPUT_UNIT: "${{ inputs.output_unit || 'celsius' }}"
      JOB_KEY: "${{ inputs.job_key || format('cache-hit-test-{0}', github.run_id) }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ELITE worker dependencies
        run: pip install requests numpy h5py pyhdf rasterio affine

      - name: Build/reuse China cache and crop ROI
        run: >-
          python worker.py
          --start-date "$START_DATE"
          --end-date "$END_DATE"
          --bbox "$BBOX"
          --region-name "$REGION_NAME"
          --output-unit "$OUTPUT_UNIT"

      - name: Commit new China cache
        run: |
          if [ -n "$(git status --porcelain -- data/elite/china data/metadata/elite-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/elite/china data/metadata/elite-index.json
            git commit -m "data: cache ELITE China $START_DATE [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "China cache already present; nothing to commit."
          fi

      - name: Remove temporary downloads
        if: always()
        run: rm -rf output/work

      - name: Upload requested ROI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.JOB_KEY }}"
          path: |
            output/derived/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
