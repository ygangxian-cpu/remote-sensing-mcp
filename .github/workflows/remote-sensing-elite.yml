name: Remote Sensing ELITE Worker
run-name: "ELITE ${{ inputs.job_key || format('smoke-{0}', github.run_id) }}"

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: Correlation ID used by the MCP gateway
        required: true
        type: string
      start_date:
        description: Inclusive start date/time (ISO)
        required: true
        type: string
      end_date:
        description: Exclusive end date/time (ISO)
        required: true
        type: string
      bbox:
        description: xmin,ymin,xmax,ymax in EPSG:4326
        required: true
        type: string
      output_unit:
        description: celsius or kelvin
        required: true
        default: celsius
        type: choice
        options:
          - celsius
          - kelvin


  push:
    branches:
      - main
    paths:
      - "worker.py"

permissions:
  contents: read

jobs:
  elite:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      JOB_KEY: "${{ inputs.job_key || format('smoke-{0}', github.run_id) }}"
      START_DATE: "${{ inputs.start_date || '2019-09-24T00:00:00' }}"
      END_DATE: "${{ inputs.end_date || '2019-09-25T00:00:00' }}"
      BBOX: "${{ inputs.bbox || '100.1,38.7667,100.6,39.0667' }}"
      OUTPUT_UNIT: "${{ inputs.output_unit || 'celsius' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ELITE worker dependencies
        run: pip install requests numpy h5py rasterio affine

      - name: Download, geolocate and crop ELITE FY-4A LST
        run: >-
          python worker.py
          --start-date "$START_DATE"
          --end-date "$END_DATE"
          --bbox "$BBOX"
          --output-unit "$OUTPUT_UNIT"

      - name: Remove cache before artifact upload
        if: always()
        run: rm -rf output/cache output/hdf

      - name: Upload clipped GeoTIFFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.JOB_KEY }}"
          path: |
            output/elite/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
