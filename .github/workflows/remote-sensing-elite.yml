name: Remote Sensing ELITE Worker
run-name: "ELITE ${{ inputs.job_key }}"

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: Correlation ID used by the MCP gateway
        required: true
        type: string
      start_date:
        description: Inclusive start date/time (ISO)
        required: true
        type: string
      end_date:
        description: Exclusive end date/time (ISO)
        required: true
        type: string
      bbox:
        description: xmin,ymin,xmax,ymax in EPSG:4326
        required: true
        type: string
      region_name:
        description: Stable ROI name, e.g. zhangye or beijing
        required: false
        default: ""
        type: string
      output_unit:
        description: celsius or kelvin
        required: true
        default: celsius
        type: choice
        options:
          - celsius
          - kelvin


permissions:
  contents: write

concurrency:
  group: elite-china-cache
  cancel-in-progress: false

jobs:
  elite:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ELITE worker dependencies
        run: pip install requests numpy h5py pyhdf rasterio affine

      - name: Build/reuse China cache and crop ROI
        run: >-
          python worker.py
          --start-date '${{ inputs.start_date }}'
          --end-date '${{ inputs.end_date }}'
          --bbox '${{ inputs.bbox }}'
          --region-name '${{ inputs.region_name }}'
          --output-unit '${{ inputs.output_unit }}'

      - name: Commit new China cache
        run: |
          if [ -n "$(git status --porcelain -- data/elite/china data/metadata/elite-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/elite/china data/metadata/elite-index.json
            git commit -m "data: cache ELITE China ${{ inputs.start_date }} [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "China cache already present; nothing to commit."
          fi

      - name: Remove temporary downloads
        if: always()
        run: rm -rf output/work

      - name: Upload requested ROI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.job_key }}"
          path: |
            output/derived/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
