name: Remote Sensing ELITE Worker
run-name: "ELITE ${{ inputs.job_key }}"

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: Correlation ID used by the MCP gateway
        required: true
        type: string
      start_date:
        description: Inclusive start date/time (ISO)
        required: true
        type: string
      end_date:
        description: Exclusive end date/time (ISO)
        required: true
        type: string
      bbox:
        description: xmin,ymin,xmax,ymax in EPSG:4326
        required: true
        type: string
      region_name:
        description: Stable human-readable ROI name, e.g. zhangye or beijing
        required: false
        default: ""
        type: string
      output_unit:
        description: celsius or kelvin
        required: true
        default: celsius
        type: choice
        options:
          - celsius
          - kelvin

permissions:
  contents: read

jobs:
  elite:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      REMOTE_DATA_BUCKET: "${{ secrets.REMOTE_DATA_BUCKET }}"
      GCP_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.GCP_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ELITE worker dependencies
        run: >-
          pip install
          requests
          numpy
          h5py
          pyhdf
          rasterio
          affine
          google-cloud-storage
          google-auth

      - name: Process ELITE FY-4A LST
        run: >-
          python worker.py
          --start-date '${{ inputs.start_date }}'
          --end-date '${{ inputs.end_date }}'
          --bbox '${{ inputs.bbox }}'
          --region-name '${{ inputs.region_name }}'
          --output-unit '${{ inputs.output_unit }}'

      - name: Remove ephemeral work files
        if: always()
        run: rm -rf output/work

      - name: Upload derived ROI GeoTIFFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.job_key }}"
          path: |
            output/derived/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
