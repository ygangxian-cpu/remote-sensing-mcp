name: ERA5 Legacy OAuth Probe
run-name: "ERA5 legacy probe ${{ github.run_id }}"

on:
  push:
    branches:
      - main
    paths:
      - ".github/era5-legacy-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          mkdir -p "$HOME/.config/earthengine"
          printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
          chmod 600 "$HOME/.config/earthengine/credentials"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-project-requirement Earth Engine client
        run: pip install "earthengine-api==1.4.6"

      - name: Probe legacy OAuth and ERA5-Land
        run: |
          python - <<'PY'
          import ee
          print("earthengine-api", ee.__version__)
          ee.Initialize()
          count = (
              ee.ImageCollection("ECMWF/ERA5_LAND/HOURLY")
              .filterDate("2019-09-24T00:00:00", "2019-09-24T01:00:00")
              .size()
              .getInfo()
          )
          print("ERA5_LAND_COUNT", count)
          PY
