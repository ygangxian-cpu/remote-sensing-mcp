name: Temp Fetch Formal MODIS 2019-09-23
on:
  push:
    branches:
      - experiment/fetch-formal-modis-20190923

permissions:
  contents: write

concurrency:
  group: temp-formal-modis-20190923
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/fetch-formal-modis-20190923
          fetch-depth: 1
          persist-credentials: true

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install earthengine-api google-auth requests numpy rasterio

      - name: Fetch formal ROI MODIS
        run: >-
          python modis_worker.py
          --start-date '2019-09-23'
          --end-date '2019-09-24'
          --bbox '99.86,38.67,100.5,39.43'
          --region-name 'zhangye'
          --platforms 'terra,aqua'

      - name: Commit cache to experiment branch
        run: |
          if [ -n "$(git status --porcelain -- data/modis_lst data/metadata/modis-lst-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/modis_lst data/metadata/modis-lst-index.json
            git commit -m "data: cache formal ROI MODIS 2019-09-23 [skip vercel]"
            git push origin HEAD:experiment/fetch-formal-modis-20190923
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-modis-20190923
          path: |
            output/modis_lst/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
