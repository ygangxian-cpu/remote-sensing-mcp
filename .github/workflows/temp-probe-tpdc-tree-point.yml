name: TEMP TPDC Tree Point Probe
run-name: "TPDC tree point probe"

on:
  push:
    paths:
      - ".github/workflows/temp-probe-tpdc-tree-point.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python experiments/probe_tpdc_tree_point.py
