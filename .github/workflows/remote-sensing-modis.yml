name: Remote Sensing MODIS LST Worker
run-name: "MODIS LST ${{ inputs.job_key || format('modis-bulk-{0}', github.run_id) }}"

on:
  workflow_dispatch:
    inputs:
      job_key:
        required: true
        type: string
      start_date:
        description: Inclusive date
        required: true
        type: string
      end_date:
        description: Exclusive date
        required: true
        type: string
      bbox:
        description: xmin,ymin,xmax,ymax EPSG:4326
        required: true
        type: string
      region_name:
        required: false
        default: ""
        type: string
      platforms:
        required: false
        default: "terra,aqua"
        type: string


  push:
    branches: [main]
    paths: [".github/modis-bulk-trigger"]

permissions:
  contents: write

concurrency:
  group: modis-lst-repository-cache
  cancel-in-progress: false

jobs:
  modis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
      JOB_KEY: "${{ inputs.job_key || format('modis-bulk-{0}', github.run_id) }}"
      START_DATE: "${{ inputs.start_date || '2019-09-15' }}"
      END_DATE: "${{ inputs.end_date || '2019-10-01' }}"
      BBOX: "${{ inputs.bbox || '100.1,38.7667,100.6,39.0667' }}"
      REGION_NAME: "${{ inputs.region_name || 'zhangye' }}"
      PLATFORMS: "${{ inputs.platforms || 'terra,aqua' }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install earthengine-api google-auth requests numpy rasterio

      - name: Fetch/reuse MODIS LST
        run: >-
          python modis_worker.py
          --start-date "$START_DATE"
          --end-date "$END_DATE"
          --bbox "$BBOX"
          --region-name "$REGION_NAME"
          --platforms "$PLATFORMS"

      - name: Commit new MODIS cache
        run: |
          if [ -n "$(git status --porcelain -- data/modis_lst data/metadata/modis-lst-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/modis_lst data/metadata/modis-lst-index.json
            git commit -m "data: cache MODIS LST $REGION_NAME $START_DATE [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -rf output/work

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.JOB_KEY }}"
          path: |
            output/modis_lst/**/*.tif
            output/result.json
          if-no-files-found: warn
          retention-days: 1
