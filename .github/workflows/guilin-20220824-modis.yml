name: 桂林2022-08-24 MODIS下载

on:
  push:
    branches:
      - experiment/guilin-historical-matchups
    paths:
      - ".github/workflows/guilin-20220824-modis.yml"
      - "experiments/guilin_20220824_modis.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/guilin-historical-matchups
          fetch-depth: 0

      - name: 恢复Earth Engine凭据
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install earthengine-api google-auth requests numpy rasterio

      - name: 下载2022-08-24 Terra MOD11A1
        run: python experiments/guilin_20220824_modis.py

      - name: 检查输出
        run: |
          test -f experiments/guilin_20220824_modis/Guilin_MOD11A1_20220824_LST_QA.tif
          test -f experiments/guilin_20220824_modis/summary.json

      - name: 回写实验分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/guilin_20220824_modis
          git commit -m "data: 加入桂林2022-08-24 Terra MODIS"
          git pull --rebase origin experiment/guilin-historical-matchups
          git push origin HEAD:experiment/guilin-historical-matchups
