name: Cancel Hamdi GitHub run

on:
  push:
    branches:
      - "experiment/hamdi-2026-cairo-predictors-v1"
    paths:
      - ".github/workflows/cancel-hamdi-github-run.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel run 37087866719
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/ygangxian-cpu/remote-sensing-mcp/actions/runs/37087866719/cancel"
