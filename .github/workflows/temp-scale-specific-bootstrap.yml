name: TEMP Scale Specific Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-scale-specific-bootstrap.yml"
      - "experiments/export_scale_specific_snapshot.py"
      - "experiments/diagnose_mcp_downscaling.py"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api google-auth requests numpy pandas scipy rasterio pyproj scikit-learn

      - name: Prepare original ROI scaling factors
        run: |
          python scaling_factors_worker.py \
            --start-date 2019-09-24 \
            --end-date 2019-09-25 \
            --bbox '99.86,38.67,100.5,39.43' \
            --region-name zhangye-experiment

      - name: Prepare original ROI ERA5-Land
        run: |
          python era5_worker.py \
            --start-date 2019-09-24T04:00:00 \
            --end-date 2019-09-24T05:00:00 \
            --bbox '99.86,38.67,100.5,39.43' \
            --region-name zhangye-experiment

      - name: Fetch Landsat v2 reference
        run: |
          python landsat_worker.py \
            --start-date 2019-09-24 \
            --end-date 2019-09-25 \
            --bbox '99.86,38.67,100.5,39.43' \
            --region-name zhangye-experiment \
            --satellites L8 \
            --cloud-cover-max 20

      - name: Syntax check
        run: |
          python -m py_compile experiments/mcp_rf_baseline.py
          python -m py_compile experiments/diagnose_mcp_downscaling.py
          python -m py_compile experiments/export_scale_specific_snapshot.py

      - name: Re-run baseline and diagnostics
        run: |
          python experiments/mcp_rf_baseline.py
          python experiments/diagnose_mcp_downscaling.py

      - name: Export compact MCP snapshot
        run: python experiments/export_scale_specific_snapshot.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-scale-specific-bootstrap
          path: |
            output/mcp_downscaling_baseline/**
            output/mcp_downscaling_diagnostics/**
          if-no-files-found: warn
          retention-days: 7
