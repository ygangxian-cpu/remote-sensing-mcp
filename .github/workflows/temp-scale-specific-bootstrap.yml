name: TEMP Export Landsat v2 Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-scale-specific-bootstrap.yml"
      - "experiments/export_landsat_v2_validation_snapshot.py"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api google-auth requests numpy scipy rasterio pyproj scikit-learn pandas

      - name: Prepare original ROI scaling grid
        run: |
          python scaling_factors_worker.py \
            --start-date 2019-09-24 \
            --end-date 2019-09-25 \
            --bbox '99.86,38.67,100.5,39.43' \
            --region-name zhangye-experiment

      - name: Fetch Landsat v2 QA-preserving scene
        run: |
          python landsat_worker.py \
            --start-date 2019-09-24 \
            --end-date 2019-09-25 \
            --bbox '99.86,38.67,100.5,39.43' \
            --region-name zhangye-experiment \
            --satellites L8 \
            --cloud-cover-max 20

      - name: Export clear-pixel validation snapshot
        run: |
          python -m py_compile experiments/export_landsat_v2_validation_snapshot.py
          python experiments/export_landsat_v2_validation_snapshot.py
