name: TEMP Formal ROI Landsat Surface Factors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-formal-roi-landsat-surface.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install earthengine-api google-auth requests numpy rasterio pillow

      - name: Build exact-day formal-master Landsat factors
        run: |
          python scaling_factors_worker.py \
            --start-date 2019-09-24 \
            --end-date 2019-09-25 \
            --bbox '99.8652818242,38.6791139735,100.4761362174,39.3977662008' \
            --region-name 'zhangye-formal-master'

      - name: Encode formal Landsat surface factors
        run: |
          SRC=data/scaling_factors/v1/zhangye-formal-master-955b44ac26/surface/20190924_20190924/LANDSAT_SCALING_FACTORS_100M.tif
          base64 -w 0 "$SRC" > "$SRC.b64"

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scaling_factors data/metadata/scaling-factors-index.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: cache formal-master Landsat surface factors 20190924 [skip vercel]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Diagnose and export exact Landsat B3 B4 B5
        env:
          BBOX: '99.8652818242,38.6791139735,100.4761362174,39.3977662008'
        run: |
          cat > /tmp/export_rgb.py <<'PY'
          import base64, json, os
          from pathlib import Path
          import ee, requests, rasterio, numpy as np
          from google.oauth2 import service_account

          project=os.getenv("EE_PROJECT","ee-ygangxian")
          cred=Path.home()/".config/earthengine"/"credentials"
          if cred.exists():
              ee.Initialize(project=project)
          else:
              raw=base64.b64decode(os.environ["EE_SERVICE_ACCOUNT_JSON_BASE64"]).decode()
              info=json.loads(raw)
              credentials=service_account.Credentials.from_service_account_info(
                  info,
                  scopes=["https://www.googleapis.com/auth/earthengine",
                          "https://www.googleapis.com/auth/cloud-platform"])
              ee.Initialize(credentials, project=project)

          bbox=[float(x) for x in os.environ["BBOX"].split(",")]
          region=ee.Geometry.Rectangle(bbox,proj="EPSG:4326",geodesic=False)
          col=(ee.ImageCollection("LANDSAT/LC08/C02/T1_L2")
               .filterDate("2019-09-24","2019-09-25")
               .filterBounds(region)
               .filter(ee.Filter.eq("PROCESSING_LEVEL","L2SP"))
               .sort("CLOUD_COVER"))
          print("scene_count",col.size().getInfo())
          img=ee.Image(col.first())
          print("product",img.get("LANDSAT_PRODUCT_ID").getInfo(),
                "cloud",img.get("CLOUD_COVER").getInfo())

          qa=img.select("QA_PIXEL")
          mask=ee.Image(1)
          for bit in [0,1,2,3,4,5]:
              mask=mask.And(qa.bitwiseAnd(1<<bit).eq(0))
          mask=mask.And(img.select("QA_RADSAT").eq(0))

          outdir=Path("data/landsat_rgb/v1/zhangye-formal-master/2019/09/24")
          outdir.mkdir(parents=True,exist_ok=True)
          for band in ["SR_B3","SR_B4","SR_B5"]:
              image=img.select(band).multiply(0.0000275).add(-0.2).updateMask(mask).rename(band).toFloat()
              url=image.getDownloadURL({
                  "name":band,"region":region,"scale":30,"crs":"EPSG:4326","format":"GEO_TIFF"
              })
              p=outdir/f"{band}_20190924_30m.tif"
              with requests.get(url,stream=True,timeout=240) as r:
                  r.raise_for_status()
                  with p.open("wb") as fp:
                      for chunk in r.iter_content(2*1024*1024):
                          if chunk: fp.write(chunk)
              with rasterio.open(p) as src:
                  a=src.read(1,masked=True).astype("float32")
                  v=a.compressed()
                  print(band,src.shape,str(src.crs),
                        "n",v.size,"min",float(v.min()),"max",float(v.max()),
                        "mean",float(v.mean()),"std",float(v.std()))
              b64=p.with_suffix(p.suffix+".b64")
              b64.write_text(base64.b64encode(p.read_bytes()).decode("ascii"),encoding="ascii")

          # Formal WorldCover handoff.
          wc=Path("data/scaling_factors/v1/zhangye-formal-master-955b44ac26/static/WORLDCOVER_2021_100M.tif")
          wc.with_suffix(wc.suffix+".b64").write_text(
              base64.b64encode(wc.read_bytes()).decode("ascii"), encoding="ascii")
          PY
          python /tmp/export_rgb.py

      - name: Commit exact RGB and WorldCover handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/landsat_rgb data/scaling_factors/v1/zhangye-formal-master-955b44ac26/static/WORLDCOVER_2021_100M.tif.b64
          if git diff --cached --quiet; then
            echo "No exact RGB changes"
          else
            git commit -m "data: cache exact formal-master Landsat B3 B4 B5 and WorldCover [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload exact RGB diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: formal-master-landsat-rgb-20190924
          path: |
            data/landsat_rgb/v1/zhangye-formal-master/2019/09/24/*.tif
            data/scaling_factors/v1/zhangye-formal-master-955b44ac26/static/WORLDCOVER_2021_100M.tif
          retention-days: 7

      - name: Build 100m false-color display raster
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import numpy as np
          import rasterio
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject
          from rasterio.enums import Resampling

          root=Path("data/landsat_rgb/v1/zhangye-formal-master/2019/09/24")
          paths={b:root/f"{b}_20190924_30m.tif" for b in ["SR_B3","SR_B4","SR_B5"]}
          left,bottom,right,top=99.8652818242,38.6791139735,100.4761362174,39.3977662008
          width,height=680,800
          dst_transform=from_bounds(left,bottom,right,top,width,height)
          dst_crs="EPSG:4326"

          arrs={}
          for band,p in paths.items():
              with rasterio.open(p) as src:
                  src_arr=src.read(1,masked=True).astype("float32")
                  src_data=src_arr.filled(np.nan)
                  dst=np.full((height,width),np.nan,dtype="float32")
                  reproject(
                      source=np.where(np.isfinite(src_data),src_data,-9999.0).astype("float32"),
                      destination=dst,
                      src_transform=src.transform,
                      src_crs=src.crs,
                      src_nodata=-9999.0,
                      dst_transform=dst_transform,
                      dst_crs=dst_crs,
                      dst_nodata=np.nan,
                      resampling=Resampling.bilinear,
                  )
                  arrs[band]=dst

          valid=np.isfinite(arrs["SR_B3"]) & np.isfinite(arrs["SR_B4"]) & np.isfinite(arrs["SR_B5"])
          rgb=[]
          for band in ["SR_B5","SR_B4","SR_B3"]:
              a=arrs[band]
              vals=a[valid]
              lo,hi=np.percentile(vals,[2,98])
              z=np.clip((a-lo)/(hi-lo),0,1)
              z=np.power(z,0.92)
              u=np.zeros(a.shape,dtype="uint8")
              u[valid]=np.round(z[valid]*255).astype("uint8")
              rgb.append(u)

          out=root/"LANDSAT8_B5B4B3_FALSE_COLOR_100M_20190924.tif"
          profile={
              "driver":"GTiff","height":height,"width":width,"count":3,
              "dtype":"uint8","crs":dst_crs,"transform":dst_transform,
              "compress":"deflate","predictor":2,"nodata":0,
          }
          with rasterio.open(out,"w",**profile) as dst:
              for i,(name,a) in enumerate(zip(["R_B5_NIR","G_B4_RED","B_B3_GREEN"],rgb),start=1):
                  dst.write(a,i)
                  dst.set_band_description(i,name)
              dst.update_tags(
                  source_product="LC08_L2SP_133033_20190924_20200826_02_T1",
                  composite="B5(NIR)->R,B4(RED)->G,B3(GREEN)->B",
                  stretch="2-98 percentile; gamma 0.92",
                  grid="formal 4km master footprint; 100m display grid",
              )
          out.with_suffix(out.suffix+".b64").write_text(
              base64.b64encode(out.read_bytes()).decode("ascii"),encoding="ascii")
          print("rgb_size",out.stat().st_size,"b64_size",out.with_suffix(out.suffix+".b64").stat().st_size)
          PY

      - name: Commit compact display raster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/landsat_rgb/v1/zhangye-formal-master/2019/09/24/LANDSAT8_B5B4B3_FALSE_COLOR_100M_20190924.tif*
          if git diff --cached --quiet; then
            echo "No RGB display changes"
          else
            git commit -m "data: add formal-master Landsat false-color display raster [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build compact JPEG handoff
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import numpy as np
          import rasterio
          from PIL import Image

          root=Path("data/landsat_rgb/v1/zhangye-formal-master/2019/09/24")
          tif=root/"LANDSAT8_B5B4B3_FALSE_COLOR_100M_20190924.tif"
          with rasterio.open(tif) as src:
              rgb=np.moveaxis(src.read([1,2,3]),0,-1).astype("uint8")
          jpg=root/"LANDSAT8_B5B4B3_FALSE_COLOR_100M_20190924.jpg"
          Image.fromarray(rgb,"RGB").save(jpg,quality=94,subsampling=0,optimize=True)
          b64=jpg.with_suffix(jpg.suffix+".b64")
          b64.write_text(base64.b64encode(jpg.read_bytes()).decode("ascii"),encoding="ascii")
          print("jpg_size",jpg.stat().st_size,"jpg_b64_size",b64.stat().st_size)
          PY

      - name: Commit compact JPEG handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/landsat_rgb/v1/zhangye-formal-master/2019/09/24/LANDSAT8_B5B4B3_FALSE_COLOR_100M_20190924.jpg*
          if git diff --cached --quiet; then
            echo "No JPEG changes"
          else
            git commit -m "data: add compact formal-master Landsat false-color JPEG [skip vercel]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
