name: Temp Validate Landsat MCP Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-validate-landsat-mcp-fix.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax validation
        run: python -m py_compile app.py landsat_worker.py

      - name: Validate Landsat v3 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("landsat_worker.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/remote-sensing-landsat.yml").read_text(encoding="utf-8")
          assert 'CACHE_VERSION = "v3"' in worker
          assert '("SR_B2", "SR_B2", "reflectance")' not in worker
          assert '"landsat_cache_version": "v3"' in app
          assert '"workflow_succeeded": conclusion == "success"' in app
          assert "continue-on-error: true" in workflow
          print("Landsat v3 contract checks passed")
          PY

      - name: Install Landsat worker dependencies
        run: pip install earthengine-api google-auth requests numpy rasterio

      - name: Run Zhangye Landsat v3 smoke test
        run: >-
          python landsat_worker.py
          --start-date '2019-09-24'
          --end-date '2019-09-25'
          --bbox '99.86,38.67,100.5,39.43'
          --region-name 'zhangye-smoke'
          --satellites 'L8'
          --cloud-cover-max '80'

      - name: Validate generated cache size and bands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import rasterio

          files = list(Path("data/landsat_c2_l2/v3").glob("**/*_L2_LST_QA.tif"))
          assert files, "No v3 Landsat cache file was generated"
          for p in files:
              size = p.stat().st_size
              print(p, size)
              assert size < 100 * 1024 * 1024, f"{p} exceeds GitHub 100 MiB limit"
              with rasterio.open(p) as src:
                  assert src.count == 4, src.count
                  assert list(src.descriptions) == ["LST_C", "ST_QA_K", "QA_PIXEL", "QA_RADSAT"]
          result = json.loads(Path("output/result.json").read_text(encoding="utf-8"))
          assert result["cache_version"] == "v3"
          assert result["scene_count"] >= 1
          print("Landsat v3 smoke test passed")
          PY

      - name: Wait for Vercel v0.11.1
        shell: bash
        run: |
          for i in {1..18}; do
            body="$(curl -fsS https://remote-sensing-mcp.vercel.app/health || true)"
            echo "$body"
            compact="$(printf '%s' "$body" | tr -d '[:space:]')"
            if echo "$compact" | grep -q '"version":"0.11.1"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health did not report v0.11.1 in time"
          exit 1
