name: TEMP Build ILC-v1 2019-09-24 Parity Reference

on:
  push:
    branches: [main]
    paths:
      - "experiments/build_ilc_v1_20190924_parity_reference.py"
      - ".github/workflows/temp-build-ilc-v1-20190924-parity-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          pip install earthengine-api google-auth requests remotezip
          numpy pandas scipy scikit-learn rasterio pyproj h5py pyhdf affine

      - name: Syntax check
        run: |
          python -m py_compile experiments/build_ilc_v1_20190924_parity_reference.py
          python -m py_compile experiments/run_frozen_v3_multidate_validation.py

      - name: Build fresh data-only parity reference
        run: python experiments/build_ilc_v1_20190924_parity_reference.py

      - name: Upload reference snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ilc-v1-parity-reference-20190924
          path: |
            output/ilc_v1_parity_reference_data/*.npz
            output/ilc_v1_parity_reference_data/*.json
          if-no-files-found: error
          retention-days: 14
