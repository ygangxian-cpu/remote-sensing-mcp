name: Temp ANCFDS Stage2 20190924 Pilot

on:
  push:
    branches:
      - main
    paths:
      - "experiments/run_ancfds_stage2_20190924_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy rasterio pyproj scikit-learn matplotlib

      - name: Run ANCFDS 1 km -> 100 m pilot
        run: python experiments/run_ancfds_stage2_20190924_pilot.py

      - name: Print result summary
        if: always()
        run: |
          echo "=== metrics.csv ==="
          cat output/ancfds_stage2_20190924/metrics.csv || true
          echo
          echo "=== summary.json ==="
          cat output/ancfds_stage2_20190924/summary.json || true

      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancfds-stage2-20190924-pilot
          path: output/ancfds_stage2_20190924/**
          if-no-files-found: error
          retention-days: 7
