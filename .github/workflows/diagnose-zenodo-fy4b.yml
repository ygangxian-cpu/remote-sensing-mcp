name: diagnose-fy4b-zenodo

on:
  push:
    branches: [experiment/guilin-20220824-data]
    paths: [".github/workflows/diagnose-zenodo-fy4b.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Zenodo records
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          for q in [
              "ELITE land surface temperature",
              "ELITE AGRI seamless LST",
              "land surface temperature AGRI hourly 4km seamless LST",
              "202208",
          ]:
              url="https://zenodo.org/api/records?"+urllib.parse.urlencode({"q":q,"size":100})
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      status=r.status
                      data=json.loads(r.read().decode("utf-8"))
              except Exception as e:
                  print("QUERY",q,"ERROR",repr(e)); continue
              print("QUERY",q,"STATUS",status)
              hits=(data.get("hits") or {}).get("hits") or []
              print("COUNT",len(hits),"TOTAL",(data.get("hits") or {}).get("total"))
              for h in hits[:100]:
                  title=(h.get("metadata") or {}).get("title","")
                  files=h.get("files") or {}
                  entries=files.get("entries",files) if isinstance(files,dict) else files
                  items=list(entries.values()) if isinstance(entries,dict) else list(entries or [])
                  names=[str(x.get("key") or x.get("filename") or "") for x in items]
                  if "ELITE" in title or any("202208" in n for n in names):
                      print("HIT",h.get("id"),repr(title),names)
          PY
