name: TEMP Verify Remote MCP Health
run-name: "Verify remote MCP health"

on:
  push:
    paths:
      - ".github/workflows/temp-verify-remote-mcp-health.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch production health
        shell: bash
        run: |
          set -euxo pipefail
          curl -fLsS --retry 3 --retry-delay 2 https://remote-sensing-mcp.vercel.app/health | tee health.json
          python - <<'PY'
          import json
          obj=json.load(open("health.json"))
          print(json.dumps(obj, indent=2))
          PY
