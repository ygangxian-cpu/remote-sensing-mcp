name: Four Landsat dates MODIS D-1 vs D0
on:
  push:
    branches:
      - experiment/modis-lag-four-landsat-dates

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        date: ["2020-09-10"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/modis-lag-four-landsat-dates
      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install earthengine-api google-auth requests numpy pandas rasterio affine
      - name: Run date comparison
        run: python experiments/modis_lag_four_dates.py --date "${{ matrix.date }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "modis-lag-${{ matrix.date }}"
          path: output/${{ matrix.date }}/
          retention-days: 2
