name: MCP Downscaling RF Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mcp-downscaling-rf-baseline.yml"
      - "experiments/mcp_rf_baseline.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"

    steps:
      - uses: actions/checkout@v4

      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api google-auth requests numpy pandas scipy rasterio pyproj scikit-learn

      - name: Prepare original Zhangye ROI scaling factors
        run: |
          python scaling_factors_worker.py             --start-date 2019-09-24             --end-date 2019-09-25             --bbox '99.86,38.67,100.5,39.43'             --region-name zhangye-experiment

      - name: Prepare original Zhangye ROI ERA5-Land
        run: |
          python era5_worker.py             --start-date 2019-09-24T04:00:00             --end-date 2019-09-24T05:00:00             --bbox '99.86,38.67,100.5,39.43'             --region-name zhangye-experiment

      - name: Fetch Landsat v2 reference for original Zhangye ROI
        run: |
          python landsat_worker.py             --start-date 2019-09-24             --end-date 2019-09-25             --bbox '99.86,38.67,100.5,39.43'             --region-name zhangye-experiment             --satellites L8             --cloud-cover-max 20

      - name: Run MCP RF benchmark
        run: python experiments/mcp_rf_baseline.py

      - name: Run root-cause diagnostics
        run: python experiments/diagnose_mcp_downscaling.py

      - name: Print metrics
        if: always()
        run: |
          echo "=== MCP RF BASELINE METRICS ==="
          cat output/mcp_downscaling_baseline/metrics.csv || true
          echo
          cat output/mcp_downscaling_baseline/run_summary.json || true
          echo
          echo "=== ROOT CAUSE DIAGNOSTICS ==="
          cat output/mcp_downscaling_diagnostics/diagnostics.json || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-rf-original-roi-20190924-utc0400
          path: |
            output/mcp_downscaling_baseline/**
            output/mcp_downscaling_diagnostics/**
            output/result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf output/work
