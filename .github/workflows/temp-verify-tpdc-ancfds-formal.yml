name: TEMP Verify Formal TPDC ANCFDS Worker
run-name: "Verify formal TPDC ANCFDS worker"

on:
  push:
    paths:
      - ".github/workflows/temp-verify-tpdc-ancfds-formal.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile app.py tpdc_ancfds_worker.py
      - name: Install worker dependencies
        run: pip install requests numpy rasterio
      - name: Run one-hour Zhangye verification
        run: >-
          python tpdc_ancfds_worker.py
          --start-date 2019-09-24
          --end-date 2019-09-25
          --bbox '99.86,38.67,100.5,39.43'
          --region-name zhangye-formal-test
          --hours 4
          --output-unit celsius
      - name: Inspect result
        run: |
          cat output/result.json
          find data/tpdc_ancfds -type f -maxdepth 8 -print -exec ls -lh {} \;
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: formal-tpdc-ancfds-worker-verify
          path: |
            output/tpdc_ancfds/**/*.tif
            output/result.json
          if-no-files-found: error
          retention-days: 2
