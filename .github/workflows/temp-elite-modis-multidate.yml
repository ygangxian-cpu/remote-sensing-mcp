name: TEMP ELITE-MODIS Multi-date Cross-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EE_PROJECT: "${{ vars.EE_PROJECT || 'ee-ygangxian' }}"
      EE_USER_CREDENTIALS_JSON_BASE64: "${{ secrets.EE_USER_CREDENTIALS_JSON_BASE64 }}"
      EE_SERVICE_ACCOUNT_JSON_BASE64: "${{ secrets.EE_SERVICE_ACCOUNT_JSON_BASE64 }}"
    steps:
      - uses: actions/checkout@v4
      - name: Restore Earth Engine credentials
        shell: bash
        run: |
          if [ -n "$EE_USER_CREDENTIALS_JSON_BASE64" ]; then
            mkdir -p "$HOME/.config/earthengine"
            printf '%s' "$EE_USER_CREDENTIALS_JSON_BASE64" | base64 --decode > "$HOME/.config/earthengine/credentials"
            chmod 600 "$HOME/.config/earthengine/credentials"
          elif [ -z "$EE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::Missing Earth Engine credentials"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: >-
          pip install earthengine-api google-auth requests remotezip
          numpy pandas scipy scikit-learn rasterio pyproj h5py pyhdf affine
      - name: Syntax check
        run: python -m py_compile experiments/diagnose_elite_modis_multidate.py
      - name: Run cross-check
        run: python experiments/diagnose_elite_modis_multidate.py
      - name: Print outputs
        if: always()
        run: |
          cat output/elite_modis_multidate/elite_modis_exact_time_metrics.csv || true
          echo
          cat output/elite_modis_multidate/date_summary.csv || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-modis-multidate-crosscheck-2019
          path: |
            output/elite_modis_multidate/*.csv
            output/elite_modis_multidate/*.json
          if-no-files-found: warn
          retention-days: 14
