[project]
name = "remote-sensing-mcp"
version = "0.4.0"
description = "Remote MCP gateway for Earth Engine and persistent ELITE FY-4A LST data workflows."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2.0,<3",
  "earthengine-api>=1.5,<2",
  "requests>=2.32,<3",
  "google-auth>=2.35,<3",
  "fastapi>=0.115,<1"
]

[tool.vercel]
entrypoint = "app:app"
