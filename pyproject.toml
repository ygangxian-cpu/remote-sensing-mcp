[project]
name = "remote-sensing-mcp"
version = "0.6.0"
description = "Remote MCP gateway for repository-cached ELITE FY-4A and ERA5-Land workflows."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2.0,<3",
  "earthengine-api>=1.5,<2",
  "requests>=2.32,<3",
  "google-auth>=2.35,<3",
  "fastapi>=0.115,<1"
]

[tool.vercel]
entrypoint = "app:app"
